media:
  input: public/images/recipes
  output: /images/recipes
  rename: safe
  categories: [image]

content:
  - name: recipes
    label: Recipes
    type: collection
    path: src/data/recipes
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [fandom, published, featured]
      sort: date
      order: desc
    fields:
      - name: title
        label: Recipe name
        type: string
        required: true
      - name: description
        label: Short description
        type: text
        required: true
      - name: fandom
        label: Fandom
        type: select
        required: true
        options:
          values:
            - name: World of Warcraft
              label: World of Warcraft
            - name: Dota 2
              label: Dota 2
            - name: Middle-earth
              label: Middle-earth
            - name: Star Wars
              label: Star Wars
            - name: Original fantasy
              label: Original fantasy
      - name: category
        label: Category
        type: select
        required: true
        options:
          values: [Main, Snack, Baking, Dessert, Drink]
      - name: image
        label: Food photo
        type: image
      - name: prepTime
        label: Preparation time
        type: string
      - name: cookTime
        label: Cooking time
        type: string
      - name: servings
        label: Servings
        type: string
      - name: date
        label: Publication date
        type: date
        required: true
      - name: featured
        label: Featured on homepage
        type: boolean
        default: false
      - name: published
        label: Published
        type: boolean
        default: false
      - name: ingredients
        label: Ingredients
        type: string
        list: true
        required: true
      - name: body
        label: Instructions
        type: rich-text
        required: true

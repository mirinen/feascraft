media:
  input: public/images/recipes
  output: /images/recipes
  rename: random
  extensions: [jpg, jpeg, png, webp, avif, gif]

components:
  foodPhoto:
    label: Food photo
    type: image
    description: Tap Upload to choose a photo. If you see error 413, make a smaller copy at feastcraftwithmiri.com/admin/#photo and upload it from Files.
  photoAxis:
    type: number
    default: 50
    options:
      min: 0
      max: 100
  fandom:
    label: Fandom
    type: select
    required: true
    options:
      values:
        - World of Warcraft
        - Middle-earth
        - Harry Potter
        - Dota 2
        - Star Wars
        - Hearthstone
        - The Witcher
        - Game of Thrones
        - Moomins
        - Jurassic World
        - The Elder Scrolls
        - Original fantasy
  published:
    label: Published
    type: boolean
    default: false
    description: Turn on and save when you're ready to put this on Feastcraft.

content:
  - name: recipes
    label: Original Recipes
    type: collection
    path: src/data/recipes
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, date, published]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Recipe name
        type: string
        required: true
      - name: image
        component: foodPhoto
      - name: photoY
        component: photoAxis
        label: Vertical photo position
        description: 0 shows the top, 50 the middle and 100 the bottom.
      - name: photoX
        component: photoAxis
        label: Horizontal photo position
        description: 0 shows the left, 50 the middle and 100 the right.
      - name: description
        label: Short description
        type: text
        required: true
      - name: fandom
        component: fandom
      - name: category
        label: Category
        type: select
        required: true
        options:
          values: [Main, Snack, Baking, Dessert, Drink]
      - name: prepTime
        label: Preparation time
        type: string
      - name: cookTime
        label: Cooking time
        type: string
      - name: servings
        label: Servings
        type: string
      - name: date
        label: Publication date
        type: date
        required: true
      - name: featured
        hidden: true
        type: boolean
        default: false
      - name: ingredients
        label: Ingredients
        type: string
        list: true
        required: true
      - name: body
        label: Instructions
        type: rich-text
        required: true
      - name: published
        component: published

  - name: cooking-log
    label: Cooking Log
    type: collection
    path: src/data/cooking-log
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, date, published]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Dish name
        type: string
        required: true
      - name: image
        component: foodPhoto
      - name: photoY
        component: photoAxis
        label: Vertical photo position
        description: 0 shows the top, 50 the middle and 100 the bottom.
      - name: photoX
        component: photoAxis
        label: Horizontal photo position
        description: 0 shows the left, 50 the middle and 100 the right.
      - name: description
        label: Short description
        type: text
        required: true
      - name: fandom
        component: fandom
      - name: category
        label: Category
        type: select
        required: true
        default: Cookbook dish
        options:
          values: [Cookbook dish, Cookbook drink]
      - name: date
        label: Date cooked
        type: date
        required: true
      - name: cookbook
        label: Cookbook title
        type: string
      - name: cookbookUrl
        label: Amazon cookbook link
        type: string
        pattern:
          regex: '^(https?://[^\s/]+[^\s]*)?$'
          message: Enter a full web address, including https://.
      - name: videoUrl
        label: Video link
        type: string
        pattern:
          regex: '^(https?://[^\s/]+[^\s]*)?$'
          message: Enter a full web address, including https://.
      - name: body
        label: Cooking notes
        type: rich-text
        required: true
      - name: published
        component: published
